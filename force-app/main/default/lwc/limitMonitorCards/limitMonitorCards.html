<template>
    <lightning-card title="Limites da Org" icon-name="utility:dashboard">
        <div slot="actions">
            <lightning-button
                label="Atualizar"
                variant="neutral"
                onclick={handleRefresh}
                disabled={isLoading}>
            </lightning-button>
        </div>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium slds-is-relative">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Carregando limites" size="medium"></lightning-spinner>
            </template>

            <template if:true={errorMessage}>
                <div class="slds-text-color_error" role="alert">{errorMessage}</div>
            </template>

            <template if:true={showEmpty}>
                <p class="slds-text-body_regular">Nenhum limite monitorado encontrado.</p>
            </template>

            <template if:true={hasCards}>
                <ul class="slds-grid slds-wrap slds-gutters" role="list">
                    <template for:each={cards} for:item="card">
                        <li key={card.key} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-p-bottom_small">
                            <div class={card.cardClass} role="group" aria-label={card.label}>
                                <p class="slds-text-title_caps">{card.label}</p>
                                <p class="slds-text-heading_medium">{card.percentLabel}</p>
                                <lightning-progress-bar value={card.barValue} size="medium"></lightning-progress-bar>
                                <p class="slds-text-body_small slds-m-top_x-small">
                                    {card.usageText} · <strong>{card.statusLabel}</strong>
                                </p>
                            </div>
                        </li>
                    </template>
                </ul>
            </template>
        </div>
    </lightning-card>
</template>
